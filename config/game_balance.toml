# Central game balance. Change this file instead of editing handlers/services.

max_teacher_slots = 4
initial_castle_strength = 100
initial_defense_power = 25
teacher_activation_cost = 120
teacher_sell_ratio = 0.5

[shield_rules]
# Global limits for shield values. Individual shield prices and strength are
# managed from the admin panel, while this section protects the game balance.
min_reduction_percent = 0
max_reduction_percent = 100
max_flat_absorption = 1000000

[mine]
# Production is calculated when the user opens the mine, so no worker is
# required. Values are resources per minute. The next level's required player
# level controls whether the upgrade button is available.
max_catchup_minutes = 1440

[mine.levels.level_1]
coin_per_minute = 2
diamond_per_minute = 0
banana_per_minute = 1
upgrade_cost = 300
required_player_level = 1

[mine.levels.level_2]
coin_per_minute = 5
diamond_per_minute = 0
banana_per_minute = 2
upgrade_cost = 750
required_player_level = 1

[mine.levels.level_3]
