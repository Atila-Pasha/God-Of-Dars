# Central game balance. Change this file instead of editing handlers/services.

# Ownership capacity is separate from the attack limit below.
max_owned_teacher_slots = 30
max_attack_teachers = 4
initial_castle_strength = 100
initial_defense_power = 25

# Cost to activate a teacher.

# Selling/refunding a teacher should never create a positive-resource loop.

teacher_activation_cost = 120
teacher_sell_ratio = 0.5

[upgrade_rewards]
banana_per_diamond = 10
minimum_banana = 1
maximum_banana = 500

[castle_progression]
max_level = 500
cost_growth = 1.012
strength_growth = 1.02
defense_growth = 1.02

# Attack balance. Defence first absorbs incoming teacher damage; the remaining
# amount damages the castle. The castle then counter-attacks the teacher.
[attack]
defense_absorption_ratio = 1.0
counter_damage_ratio = 0.25
loot_percent = 10
banana_reward = 20

[hospital]
instant_recovery_diamond_cost = 15

[castle_repair]
# Repair cost is proportional to missing castle strength.
diamond_cost_per_100_strength = 5
minimum_diamond_cost = 1
# Weak castles can yield more loot; the result is capped below.
loot_bonus_percent_at_zero_strength = 100
maximum_loot_percent = 100

[shield_rules]

# Global limits for shield values. Individual shield prices and strength are

# managed from the admin panel, while this section protects the game balance.

min_reduction_percent = 0
max_reduction_percent = 75
max_flat_absorption = 1000000

[mine]

# Production is calculated when the user opens the mine, so no worker is

# required. Values are resources per minute.

#

# Catch-up is intentionally capped to 12 hours so inactive players benefit

# from returning without accumulating excessive resources.

max_catchup_minutes = 720
max_level = 500
coin_growth = 1.004
diamond_growth = 1.008
cost_growth = 1.008

# ---------------------------------------------------------------------------

# Mine progression

#

# The mine should provide a meaningful passive income while upgrades require

# enough investment to prevent players from snowballing too quickly.

# ---------------------------------------------------------------------------

[mine.levels.level_1]
coin_per_minute = 2
diamond_per_minute = 0
banana_per_minute = 0
diamond_cost = 300
required_player_level = 1

[mine.levels.level_2]
coin_per_minute = 4
diamond_per_minute = 1
banana_per_minute = 0
diamond_cost = 800
required_player_level = 1

[mine.levels.level_3]
coin_per_minute = 7
diamond_per_minute = 2
banana_per_minute = 0
diamond_cost = 1600
required_player_level = 3

[mine.levels.level_4]
coin_per_minute = 12
diamond_per_minute = 3
banana_per_minute = 0
diamond_cost = 3200
required_player_level = 5

[mine.levels.level_5]
coin_per_minute = 20
diamond_per_minute = 5
banana_per_minute = 0
diamond_cost = 6500
required_player_level = 7

[mine.levels.level_6]
coin_per_minute = 32
diamond_per_minute = 8
banana_per_minute = 0
diamond_cost = 13000
required_player_level = 10

# ---------------------------------------------------------------------------

# Buffet exchange rates

#

# Rates intentionally include a spread so converting resources back and forth

# cannot generate resources through arbitrage.

#

# Approximate base value:

# 1 DIAMOND = 100 COIN

# 1 BANANA  = 50 COIN

#

# Selling resources back through the buffet gives a lower return.

# ---------------------------------------------------------------------------

[[buffet.conversions]]
source = "COIN"
target = "DIAMOND"
source_amount = 100
target_amount = 1

[[buffet.conversions]]
source = "DIAMOND"
target = "COIN"
source_amount = 1
target_amount = 90

# ---------------------------------------------------------------------------

# Teacher slots

#

# Additional teachers unlock gradually with player progression.

# ---------------------------------------------------------------------------

[teacher_slots]
level_1 = 1
level_5 = 2
level_10 = 4
level_20 = 6
level_50 = 10
level_100 = 15
level_200 = 20
level_500 = 30

[teacher_slots_progression]
base = 1
growth = 0
interval = 1

# ---------------------------------------------------------------------------

# Teacher damage multiplier

#

# Damage grows progressively rather than exponentially. Higher levels remain

# valuable but should not make early-game teachers completely irrelevant.

# ---------------------------------------------------------------------------

[teacher_damage]
level_2 = 1.20
level_3 = 1.40
level_4 = 1.65
level_5 = 1.95
level_6 = 2.30
level_7 = 2.70
level_8 = 3.15
level_9 = 3.65
level_10 = 4.20

[teacher_damage.explicit]

# Optional per-teacher overrides: "teacher_id:level" = damage

[teacher_damage_progression]
growth = 1.04
max_multiplier = 8.0

# ---------------------------------------------------------------------------

# Castle upgrades

#

# Costs and defensive gains scale together. Later upgrades are substantially

# more expensive so castle progression does not outpace the resource economy.

# ---------------------------------------------------------------------------

[castle_upgrades."1"]
diamond_cost = 500
strength_delta = 25
defense_delta = 10

[castle_upgrades."2"]
diamond_cost = 900
strength_delta = 35
defense_delta = 15

[castle_upgrades."3"]
diamond_cost = 1500
strength_delta = 50
defense_delta = 20

[castle_upgrades."4"]
diamond_cost = 2400
strength_delta = 70
defense_delta = 30

# ---------------------------------------------------------------------------

# Castle recovery

#

# Lower strength means longer recovery. As the castle becomes stronger,

# recovery becomes faster, preventing high-level castles from becoming

# permanently crippled after an attack.

# ---------------------------------------------------------------------------

[recovery_minutes]
strength_0 = 240
strength_150 = 180
strength_250 = 120
strength_400 = 90

# ---------------------------------------------------------------------------

# Referral reward

#

# Referral rewards should be useful but small enough that creating multiple

# accounts cannot become the dominant source of diamonds.

# ---------------------------------------------------------------------------

[referral_reward]

# Change inviter_amount and restart the bot to change the reward for new referrals.

inviter_resource = "DIAMOND"
inviter_amount = 5
