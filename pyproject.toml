[project]
name = "godofdars"
version = "0.1.0"
description = "Educational strategy game Telegram bot"
requires-python = ">=3.12"

dependencies = [
    "aiogram>=3.0",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"